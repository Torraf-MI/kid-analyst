name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[app,dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: Valutazione dell'estrattore a regole
        run: |
          kid-analyst valuta --motori regole --uscita /tmp/risultati
          cat /tmp/risultati/valutazione.md >> "$GITHUB_STEP_SUMMARY"
