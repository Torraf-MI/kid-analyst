[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kid-analyst"
version = "0.1.0"
description = "Analista AI di KID PRIIPs: estrazione strutturata con Claude, Q&A con citazioni, confronto costi e coerenza con il profilo MiFID"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.0",
  "pydantic>=2.7",
  "pdfplumber>=0.11",
  "rank-bm25>=0.2.2",
  "reportlab>=4.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "pandas>=2.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
kid-analyst = "kid_analyst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
